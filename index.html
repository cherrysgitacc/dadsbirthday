<!DOCTYPE html>
<html>
<head>
<title>For My Dad 💙</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#071124,#0b1f3a,#102b54);
color:white;
overflow-x:hidden;
}

/* ⭐ Star Background */
.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
animation:moveStars 80s linear infinite;
z-index:-1;
opacity:0.6;
}
@keyframes moveStars{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

/* Slide system */
section{
min-height:100vh;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:30px;
animation:fade 0.6s ease;
position:relative;
}
.active{display:flex;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}

h1,h2{
font-family:'Playfair Display',serif;
text-align:center;
}

/* Buttons */
button{
padding:12px 28px;
margin:10px;
border-radius:30px;
border:2px solid #f5d76e;
background:transparent;
color:#f5d76e;
font-weight:600;
cursor:pointer;
transition:0.3s;
}
button:hover{
background:#f5d76e;
color:#071124;
}

/* Cake */
.cake-container{
position:relative;
font-size:120px;
}
.flame{
position:absolute;
top:-35px;
left:50%;
transform:translateX(-50%);
font-size:40px;
animation:flicker 0.3s infinite alternate;
}
@keyframes flicker{from{opacity:1;}to{opacity:0.4;}}

/* Moving NO */
#noBtn{position:absolute;}

/* Greeting */
.greeting-section{overflow:auto;}
.greeting-img{
width:100%;
object-fit:contain;
}

/* 🎆 Fireworks */
#fireworks{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
display:none;
z-index:999;
}
.firework{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
animation:explode 1s ease-out forwards;
}
@keyframes explode{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(20);opacity:0;}
}

/* 🌌 Memory Night */
.memory{
padding-top:150px;
overflow:auto;
}

/* Main rope */
.top-rope{
position:absolute;
top:100px;
left:0;
width:100%;
height:4px;
background:linear-gradient(to right,#777,#eee,#777);
}

/* Bulbs */
.bulb{
position:absolute;
top:92px;
width:14px;
height:14px;
background:#ffd27f;
border-radius:50%;
box-shadow:0 0 20px #ffc857;
animation:blink 1.5s infinite alternate;
}
@keyframes blink{from{opacity:1;}to{opacity:0.5;}}

/* Memory Wall */
.memory-wall{
display:flex;
justify-content:space-around;
width:100%;
margin-top:150px;
}

/* Hanging photo */
.hang{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
animation:swing 4s ease-in-out infinite;
}

/* String attaches exactly to rope */
.string{
position:absolute;
top:-100px;
width:2px;
height:100px;
background:#ccc;
}

@keyframes swing{
0%{transform:rotate(-2deg);}
50%{transform:rotate(2deg);}
100%{transform:rotate(-2deg);}
}

.hang img{
width:180px;
border-radius:12px;
box-shadow:0 20px 40px rgba(0,0,0,0.8);
cursor:pointer;
transition:0.4s;
}
.hang img:hover{
transform:scale(1.08);
}

/* Popup */
#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:1000;
}
#popup img{
max-width:90%;
max-height:80%;
border-radius:12px;
box-shadow:0 20px 50px black;
}
.close-btn{
margin-top:20px;
padding:10px 20px;
border-radius:20px;
border:none;
background:#f5d76e;
color:#071124;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<div class="stars"></div>
<div id="fireworks"></div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 1 -->
<section id="s1" class="active">
<h1>A Surprise For You 💙</h1>
<button onclick="go('s2')">Open</button>
</section>

<!-- 2 Cake -->
<section id="s2">
<div class="cake-container">
🎂
<div class="flame" id="flame">🔥</div>
</div>
<h2>Make a wish & blow the candle</h2>
<button onclick="blow()">Blow Candle</button>
<button onclick="go('s3')">Next</button>
</section>

<!-- 3 -->
<section id="s3">
<h1>Please Open My Greeting 💌</h1>
<button onclick="go('s4')">YES</button>
<button id="noBtn">NO</button>
</section>

<!-- Greeting Slides -->
<section id="s4" class="greeting-section">
<img src="greetings1.png" class="greeting-img">
<button onclick="go('s5')">Next</button>
</section>

<section id="s5" class="greeting-section">
<img src="greetings2.png" class="greeting-img">
<button onclick="go('s6')">Next</button>
</section>

<section id="s6" class="greeting-section">
<img src="greeting3.png" class="greeting-img">
<button onclick="go('s7')">See Memories</button>
</section>

<!-- Memory -->
<section id="s7" class="memory">
<h2>Our Beautiful Memories ✨</h2>

<div class="top-rope"></div>

<div class="bulb" style="left:10%;"></div>
<div class="bulb" style="left:25%;"></div>
<div class="bulb" style="left:40%;"></div>
<div class="bulb" style="left:55%;"></div>
<div class="bulb" style="left:70%;"></div>
<div class="bulb" style="left:85%;"></div>

<div class="memory-wall">

<div class="hang">
<div class="string"></div>
<img src="dad4.jpeg" onclick="openPopup(this.src)">
</div>

<div class="hang">
<div class="string"></div>
<img src="dad2.jpeg" onclick="openPopup(this.src)">
</div>

<div class="hang">
<div class="string"></div>
<img src="dad5.jpeg" onclick="openPopup(this.src)">
</div>

<div class="hang">
<div class="string"></div>
<img src="dad7.jpeg" onclick="openPopup(this.src)">
</div>

<div class="hang">
<div class="string"></div>
<img src="dad12.jpeg" onclick="openPopup(this.src)">
</div>

<div class="hang">
<div class="string"></div>
<img src="dad11.jpeg" onclick="openPopup(this.src)">
</div>

</div>
<p>THANK YOU FOR EVERY THING...LOVE YOU DADDY...</p>

<button onclick="go('s1')">Start Again</button>
</section>

<!-- Popup -->
<div id="popup">
<img id="popupImg">
<button class="close-btn" onclick="closePopup()">Back</button>
</div>

<script>
function go(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.getElementById("music").play();
}

function blow(){
document.getElementById("flame").style.display="none";
launchFireworks();
}

function launchFireworks(){
const container=document.getElementById("fireworks");
container.style.display="block";
for(let i=0;i<30;i++){
let fw=document.createElement("div");
fw.classList.add("firework");
fw.style.left=Math.random()*window.innerWidth+"px";
fw.style.top=Math.random()*window.innerHeight+"px";
fw.style.background=`hsl(${Math.random()*360},100%,60%)`;
container.appendChild(fw);
setTimeout(()=>fw.remove(),1000);
}
setTimeout(()=>container.style.display="none",1200);
}

const noBtn=document.getElementById("noBtn");
function moveButton(){
const maxX=window.innerWidth-120;
const maxY=window.innerHeight-60;
noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";
}
noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("touchstart",moveButton);

function openPopup(src){
document.getElementById("popup").style.display="flex";
document.getElementById("popupImg").src=src;
}
function closePopup(){
document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
